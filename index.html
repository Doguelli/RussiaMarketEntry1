<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Russia Market Entry" />

    <!-- Open Graph / Web & Social. Only language-neutral values belong here:
         the prerenderer copies this template into every route, so anything
         Turkish-specific would also be served on the Russian and English
         pages. Language-specific tags (og:locale, keywords) come from
         react-helmet per page. -->
    <meta property="og:site_name" content="Russia Market Entry" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- AI & Search Engines Explicit Crawl Directives -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Structured data is emitted per page via react-helmet (see src/utils/seo.ts).
         It must not live here: scripts/prerender.js copies this template into every
         route, so anything in it would claim the homepage's Turkish business and
         FAQ markup on all Russian, English, service and blog pages too. -->
  </head>
  <body>
    <div id="root"></div>
    <!-- Yandex.Metrika noscript fallback (public SPA template only; /admin uses its own HTML). -->
    <noscript>
      <div>
        <img src="https://mc.yandex.ru/watch/112001301" style="position:absolute; left:-9999px;" alt="" />
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Netlify Identity: handles invite/password-recovery links that land on
         the root domain instead of /admin (standard Decap CMS + Identity setup). -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
