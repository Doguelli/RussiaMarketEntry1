          "@type": "PostalAddress",

          "@type": "PostalAddress",
          "addressCountry": "Rusya",

        }
      ],

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Türkiye’den Ozon’da satış yapılabilir mi?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Evet, Türkiye'de yerleşik şirketiniz üzerinden Ozon Global C-B (Cross-Border) modeliyle doğrudan satış yapabilirsiniz. Daha güçlü ve hızlı büyüme için ise Rusya'da bir şirket kurup B2C (Konsinye) modeliyle pazarın yerel satıcısı gibi konumlanmanız en verimli yöntemdir."
          }
        },
        {
          "@type": "Question",
          "name": "Wildberries’de Türk markaları satış yapabilir mi?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Türk markaları doğrudan Türkiye'den bireysel olarak Wildberries'de satış yapamaz. Wildberries yerel depoları ve operasyonu şart koşar. O yüzden Rusya'da ya uçtan uca bir partnerle anlaşmalı ya da lokal şirket kurulumu yapmalısınız. Lojistik ve operasyonunuzu devralarak markanızı doğrudan Wildberries Rusya raflarına çıkarıyoruz."
          }
        },
        {
          "@type": "Question",
          "name": "Rusya’da e-ticaret yapmak için şirket kurmak gerekir mi?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Toptan veya sadece Global pazar yerlerinden (border out) gönderim yapıyorsanız şirket şart değildir. Fakat Wildberries, Lamoda gibi pazar yerlerine doğrudan girmek, depo kurmak ve karlı fiyatlarla B2C doğrudan satış yapmak istiyorsanız lokal bir varlık gereklidir."
          }
        },
        {
          "@type": "Question",
          "name": "EAC sertifikası nedir, hangi ürünlerde gereklidir?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "EAC sertifikası (Avrasya Ekonomik Birliği uygunluk belgesi), tekstil, elektronik, kozmetik gibi pek çok kategoride gümrük girişinde ve pazar yerlerinde zorunludur. Tıpkı Avrupa'daki CE belgesi gibi çalışır. Bizimle çalıştığınızda sertifikasyon danışmanlığından uçtan uca destek alırsınız."
          }
        }
      ]
    }
    </script>
