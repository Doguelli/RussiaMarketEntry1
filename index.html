<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="Rusya e-ticaret, Ozon mağaza açma, Wildberries ihracat, Lamoda satış, Rusya pazarına giriş, Rusya pazar yeri yönetimi, Rusya ihracat, e-ihracat Rusya, Rusya'da şirket kurmak, EAC sertifikasyonu, Rusya depo lojistik, Russia Market Entry, B2B, B2C" />
    <meta name="author" content="Russia Market Entry" />
    
    <!-- Open Graph / Web & Social -->
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:site_name" content="Russia Market Entry" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- AI & Search Engines Explicit Crawl Directives -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Structured data is emitted per page via react-helmet (see src/utils/seo.ts).
         It must not live here: scripts/prerender.js copies this template into every
         route, so anything in it would claim the homepage's Turkish business and
         FAQ markup on all Russian, English, service and blog pages too. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Netlify Identity: handles invite/password-recovery links that land on
         the root domain instead of /admin (standard Decap CMS + Identity setup). -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
