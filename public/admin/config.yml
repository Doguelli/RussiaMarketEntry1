backend:
  name: git-gateway
  branch: main

# When this admin page is opened from localhost AND a decap-cms-proxy-server
# is running (npm run cms-proxy), Decap automatically uses that local proxy
# instead of git-gateway — no Netlify Identity login needed, and saves write
# straight to content/blog/*.md in this working copy for local testing.
# On the real deployed site (non-localhost) this has no effect; git-gateway
# is used as configured above.
local_backend: true

# Drafts go through a Netlify deploy preview before publishing, so the admin
# can see how the AI structured the plain text on the real site design before
# it goes live.
publish_mode: editorial_workflow

media_folder: "public/uploads/blog"
public_folder: "/uploads/blog"

locale: "tr"

collections:
  - name: "blog"
    label: "Blog Yazıları"
    label_singular: "Blog Yazısı"
    folder: "content/blog"
    create: true
    delete: true
    identifier_field: urlSlug
    slug: "{{fields.urlSlug}}"
    summary: "{{urlSlug}}"
    sortable_fields: ["publishedAt", "urlSlug"]
    fields:
      - label: "🇹🇷 Türkçe"
        name: "enableTr"
        widget: "boolean"
        default: true
        hint: "Kapalıysa Türkçe hiç yayınlanmaz (aşağıdaki Türkçe bölümüne bir şey yazsanız bile)."

      - label: "🇬🇧 İngilizce"
        name: "enableEn"
        widget: "boolean"
        default: true
        hint: "Açık ve boşsa, aktif olan başka bir dilden otomatik çevrilir. Kapalıysa İngilizce hiç yayınlanmaz."

      - label: "🇷🇺 Rusça"
        name: "enableRu"
        widget: "boolean"
        default: true
        hint: "Açık ve boşsa, aktif olan başka bir dilden otomatik çevrilir. Kapalıysa Rusça hiç yayınlanmaz."

      - label: "🇹🇷 Türkçe İçerik"
        name: "tr"
        widget: "object"
        collapsed: false
        required: false
        fields:
          - { label: "Kapak Görseli (opsiyonel)", name: "image", widget: "image", required: false, hint: "Diğer dillerde ayrı görsel yüklemezseniz bu görsel tüm dillerde kullanılır." }
          - { label: "Başlık (opsiyonel)", name: "title", widget: "string", required: false, hint: "Boş bırakılırsa yapay zeka metinden otomatik bir başlık çıkarır." }
          - { label: "Özet (opsiyonel)", name: "excerpt", widget: "text", required: false, hint: "Boş bırakılırsa yapay zeka otomatik bir özet çıkarır." }
          - label: "İçerik (düz metin)"
            name: "body"
            widget: "text"
            required: false
            hint: "Sadece düz metin yazın — başlıklandırma, listeleme ve renklendirmeyi yapay zeka otomatik yapacak."

      - label: "🇬🇧 İngilizce İçerik (aktifse ve boşsa otomatik çevrilir)"
        name: "en"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "Kapak Görseli (opsiyonel)", name: "image", widget: "image", required: false }
          - { label: "Başlık (opsiyonel)", name: "title", widget: "string", required: false }
          - { label: "Özet (opsiyonel)", name: "excerpt", widget: "text", required: false }
          - label: "İçerik (düz metin, opsiyonel)"
            name: "body"
            widget: "text"
            required: false
            hint: "Boş bırakırsanız (ve İngilizce aktifse) başka bir dilden otomatik çevrilir. Kendiniz özel bir metin de girebilirsiniz."

      - label: "🇷🇺 Rusça İçerik (aktifse ve boşsa otomatik çevrilir)"
        name: "ru"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "Kapak Görseli (opsiyonel)", name: "image", widget: "image", required: false }
          - { label: "Başlık (opsiyonel)", name: "title", widget: "string", required: false }
          - { label: "Özet (opsiyonel)", name: "excerpt", widget: "text", required: false }
          - label: "İçerik (düz metin, opsiyonel)"
            name: "body"
            widget: "text"
            required: false
            hint: "Boş bırakırsanız (ve Rusça aktifse) başka bir dilden otomatik çevrilir. Kendiniz özel bir metin de girebilirsiniz."

      # --- Diğer ayarlar (isteğe bağlı) ---

      - label: "URL Parçası (slug)"
        name: "urlSlug"
        widget: "string"
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Sadece küçük harf, rakam ve tire (-) kullanın, boşluk/Türkçe karakter olmaz"]
        hint: "Yazının adresi bu olacak: russiamarketentry.com/blog/<bu-metin>. Örn: ozonda-magaza-nasil-acilir"

      - label: "Yayın Tarihi"
        name: "publishedAt"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        default: "{{now}}"
